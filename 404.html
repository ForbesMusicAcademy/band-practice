<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="4; url=https://games.forbesmusic.com.au/">
<title>Forbes Music Academy practice</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #FFB805; color: #1C1C1C; font-family: "Nunito", Arial, Helvetica, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .card { background: #FEFFEC; border: 3px solid #1C1C1C; border-radius: 14px; box-shadow: 5px 5px 0 #1C1C1C; padding: 28px 24px; max-width: 420px; text-align: center; }
  img { width: 110px; height: 110px; }
  h1 { font-size: 24px; margin: 10px 0 8px; }
  p { font-size: 16px; line-height: 1.45; margin: 0 0 18px; }
  a.btn { display: inline-block; background: #FFB805; color: #1C1C1C; border: 3px solid #1C1C1C; border-radius: 10px; padding: 12px 20px; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <img src="https://raw.githubusercontent.com/ForbesMusicAcademy/forbes-music-academy-assets/main/logos/fma-logo-abrv.png" alt="Forbes Music Academy">
    <h1>Practice has moved</h1>
    <p>Home practice now lives on our games site, with songs, chords, quizzes and more. Taking you there now.</p>
    <a class="btn" href="https://games.forbesmusic.com.au/">Go to FMA Games</a>
  </div>
</body>
</html>
