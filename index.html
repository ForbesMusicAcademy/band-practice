<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Forbes Music Academy — Band Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#EFEAD9; --surface:#FFFFFF; --ink:#23231F; --ink-muted:#6B6558;
    --accent:#FFB805; --accent-soft:#FFF3D6; --border:#E8E1D2;
    --shadow: 0 24px 60px -24px rgba(35,35,31,0.35), 0 2px 8px rgba(35,35,31,0.08);
    --font-display:'Nunito','SF Pro Rounded',ui-rounded,'Segoe UI',system-ui,sans-serif;
    --font-body:'Work Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--page-bg); color:var(--ink);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .page{ max-width:640px; margin:0 auto; padding:48px 20px 60px; text-align:center; }
  .mark{ height:48px; width:auto; margin-bottom:14px; }
  h1{
    font-family:var(--font-display); font-weight:800; letter-spacing:-.01em;
    font-size:clamp(26px,6vw,34px); margin:6px 0 4px;
  }
  .hint{ color:var(--ink-muted); font-size:.9rem; margin:0 0 30px; }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
  .tiles .tile{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    box-shadow:0 2px 8px rgba(35,35,31,.06);
    color:var(--ink); text-decoration:none; padding:16px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .tiles .tile:hover, .tiles .tile:focus-visible{ border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-2px); }
  .tiles .tile:active{ transform:scale(.97); }
  .tile-icon{
    width:44px; height:44px; border-radius:50%; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .tile-title{ font-family:var(--font-display); font-weight:800; font-size:.92rem; letter-spacing:-.01em; line-height:1.25; }
  .empty{ color:var(--ink-muted); font-size:.9rem; }
  footer{ margin-top:44px; color:var(--ink-muted); font-size:.76rem; }
</style>
<div class="page">
  <img class="mark" src="https://images.squarespace-cdn.com/content/v1/6a33cfe198212b58a6deaf75/a9409f0f-e510-4d9d-82cf-6c42a8f7e9f0/New+Logo+-+TRANSPARENT.png?format=1500w" alt="Forbes Music Academy">
  <h1>Band Sheets</h1>
  <p class="hint">Tap your song to open its practice sheet</p>
  <div class="tiles">
    <a class="tile" href="Boston.html" data-title="Boston"><span class="tile-icon">🎸</span><span class="tile-title">Boston</span></a>
    <a class="tile" href="Counting Stars.html" data-title="Counting Stars"><span class="tile-icon">🎸</span><span class="tile-title">Counting Stars</span></a>
    <a class="tile" href="Ordinary.html" data-title="Ordinary"><span class="tile-icon">🎸</span><span class="tile-title">Ordinary</span></a>
  </div>
  <footer>practice.forbesmusic.com.au</footer>
</div>
